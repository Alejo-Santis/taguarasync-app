<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d9058"/>
      <stop offset="100%" stop-color="#0c4228"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- T crossbar -->
  <rect x="15" y="17" width="70" height="14" rx="7" fill="white"/>

  <!-- T stem -->
  <rect x="43" y="17" width="14" height="37" rx="7" fill="white"/>

  <!-- Sync ring: 270° arc with 90° gap at top -->
  <!-- center (50,70) r=13, circumference≈81.7 -->
  <!-- 270°=61.3 visible, 90°=20.4 gap; gap centered at top (dashoffset=-71.5) -->
  <circle cx="50" cy="70" r="13"
          fill="none"
          stroke="white"
          stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="61.3 20.4"
          stroke-dashoffset="-71.5"/>

  <!-- Arrowhead at arc end (~225° = upper-left area), pointing clockwise (lower-left) -->
  <polygon points="36,68 44,65 40,56" fill="white"/>
</svg>

##############################################################################
# Taguara Sync — Servidor Local (Farmacia)
# Ubuntu Server 24.04 LTS | Intel NUC o similar
#
# Instrucciones rápidas:
#   1. Copiar este archivo al servidor local
#   2. Copiar .env.local.example → .env y completar las variables
#   3. docker compose up -d
#   4. docker compose exec app php artisan db:seed --class=SuperAdminSeeder --force
#      (las migraciones ya corren solas — ver servicio "migrate" abajo)
##############################################################################

services:

  # ── Migraciones (una sola vez, antes que todo lo demás) ───────────────────
  # app/horizon/scheduler/sync-agent esperan a que este servicio termine con
  # éxito. Sin esto, esos servicios entran en un crash-loop hasta que la
  # tabla "cache" existe — se autorecupera por el restart policy, pero es
  # ruido evitable en cada despliegue nuevo.
  migrate:
    image: ghcr.io/taguara/taguara-sync-app:latest
    build:
      context: ../..
      dockerfile: docker/local/Dockerfile
    env_file: .env
    environment:
      APP_MODE: local
      APP_ENV: production
    command: php artisan migrate --force
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taguara
    restart: "no"

  # ── Aplicación Laravel ────────────────────────────────────────────────────
  app:
    image: ghcr.io/taguara/taguara-sync-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: local
      APP_ENV: production
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - taguara

  # ── Nginx ─────────────────────────────────────────────────────────────────
  # Sirve los estáticos de public/ (compartidos por el volumen app_public,
  # ver Dockerfile + entrypoint.sh) y reenvía PHP a app:9000 por FastCGI.
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - taguara

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - taguara

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - taguara

  # ── Horizon (queue worker) ────────────────────────────────────────────────
  horizon:
    image: ghcr.io/taguara/taguara-sync-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: local
      APP_ENV: production
    command: php artisan horizon
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - taguara

  # ── Scheduler (cron) ─────────────────────────────────────────────────────
  scheduler:
    image: ghcr.io/taguara/taguara-sync-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: local
      APP_ENV: production
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - taguara

  # ── Sync agent (ciclo de sincronización) ──────────────────────────────────
  # Despacha SyncAgentJob cada sync.agent.interval segundos (5s por defecto).
  # El Scheduler de Laravel no baja de 1 minuto de granularidad, por eso este
  # ciclo vive en su propio proceso de larga duración en vez de en el
  # contenedor "scheduler".
  sync-agent:
    image: ghcr.io/taguara/taguara-sync-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: local
      APP_ENV: production
    command: php artisan sync:agent
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - taguara

  # ── Watchtower (auto-update de imagen) ───────────────────────────────────
  # Revisa nuevas versiones de la imagen cada 6 horas y actualiza sin downtime.
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 21600   # 6 horas
      WATCHTOWER_INCLUDE_STOPPED: "false"
    command: app nginx horizon scheduler sync-agent
    networks:
      - taguara

networks:
  taguara:
    driver: bridge

volumes:
  db_data:
  redis_data:
  app_storage:
  app_public:

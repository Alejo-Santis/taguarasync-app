##############################################################################
# Taguara Sync — Servidor Local (Farmacia)
# Ubuntu Server 24.04 LTS | Intel NUC o similar
#
# Instrucciones rápidas:
#   1. Copiar este archivo al servidor local
#   2. Copiar .env.local.example → .env y completar las variables
#   3. docker compose up -d
#   4. docker compose exec app php artisan migrate --force
#   5. docker compose exec app php artisan db:seed --class=SuperAdminSeeder --force
##############################################################################

services:

  # ── Aplicación Laravel ────────────────────────────────────────────────────
  app:
    image: ghcr.io/taguara/taguara-sync-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: local
      APP_ENV: production
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taguara

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - taguara

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - taguara

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - taguara

  # ── Horizon (queue worker) ────────────────────────────────────────────────
  horizon:
    image: ghcr.io/taguara/taguara-sync-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: local
      APP_ENV: production
    command: php artisan horizon
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
      - redis
    networks:
      - taguara

  # ── Scheduler (cron) ─────────────────────────────────────────────────────
  scheduler:
    image: ghcr.io/taguara/taguara-sync-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: local
      APP_ENV: production
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
      - db
      - redis
    networks:
      - taguara

  # ── Monitor de conectividad ───────────────────────────────────────────────
  # Invalida el cache de ConnectivityService cada 3s para que el SyncAgent
  # siempre tenga un estado de red fresco.
  connectivity-monitor:
    image: ghcr.io/taguara/taguara-sync-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: local
      APP_ENV: production
    command: >
      sh -c "while true; do php artisan tinker --execute 'app(\App\Services\Sync\ConnectivityService::class)->invalidate();' 2>/dev/null; sleep 3; done"
    depends_on:
      - app
      - redis
    networks:
      - taguara

  # ── Watchtower (auto-update de imagen) ───────────────────────────────────
  # Revisa nuevas versiones de la imagen cada 6 horas y actualiza sin downtime.
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 21600   # 6 horas
      WATCHTOWER_INCLUDE_STOPPED: "false"
    command: app nginx horizon scheduler
    networks:
      - taguara

networks:
  taguara:
    driver: bridge

volumes:
  db_data:
  redis_data:
  app_storage:

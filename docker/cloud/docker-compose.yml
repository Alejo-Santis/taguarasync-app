##############################################################################
# Taguara Sync — Servidor Cloud (piloto en instancia EC2)
#
# Sin Horizon ni Redis: SESSION_DRIVER, CACHE_STORE y QUEUE_CONNECTION ya son
# "database" por defecto en modo cloud, así que no hacen falta contenedores
# extra para eso. Reutiliza el mismo Dockerfile que docker/local/.
#
# Instrucciones rápidas:
#   1. Copiar .env.cloud.example → .env y completar las variables
#   2. docker compose build
#   3. docker compose up -d
#   4. docker compose exec app php artisan db:seed --class=SuperAdminSeeder --force
#      (las migraciones ya corren solas — ver servicio "migrate" abajo)
##############################################################################

services:

  # ── Migraciones (una sola vez, antes que todo lo demás) ───────────────────
  # app/nginx/queue-worker/scheduler esperan a que este servicio termine con
  # éxito. Sin esto, queue-worker y scheduler entran en un crash-loop hasta
  # que la tabla "cache" existe — se autorecupera por el restart policy, pero
  # es ruido evitable en cada despliegue nuevo.
  migrate:
    image: taguara-sync-cloud:latest
    build:
      context: ../..
      dockerfile: docker/local/Dockerfile
    env_file: .env
    environment:
      APP_MODE: cloud
      APP_ENV: production
    command: php artisan migrate --force
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taguara
    restart: "no"

  # ── Aplicación Laravel ────────────────────────────────────────────────────
  app:
    image: taguara-sync-cloud:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: cloud
      APP_ENV: production
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - taguara

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - taguara

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - taguara

  # ── Cola de trabajos (FE, notas crédito, DIAN) ────────────────────────────
  queue-worker:
    image: taguara-sync-cloud:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: cloud
      APP_ENV: production
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - taguara

  # ── Scheduler (cron) ─────────────────────────────────────────────────────
  # Corre las tareas de routes/console.php: alertas de inventario/FE, retry
  # de contingencia, chequeo de facturación.
  scheduler:
    image: taguara-sync-cloud:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: cloud
      APP_ENV: production
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - taguara

networks:
  taguara:
    driver: bridge

volumes:
  db_data:
  app_storage:
  app_public:
